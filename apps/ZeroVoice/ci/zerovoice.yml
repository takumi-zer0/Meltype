name: ZeroVoice checks
on:
  push:
    paths: ['apps/ZeroVoice/**', '.github/workflows/zerovoice.yml']
  pull_request:
    paths: ['apps/ZeroVoice/**', '.github/workflows/zerovoice.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-14]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/ZeroVoice
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_GENERATE_ASPNET_CERTIFICATE: 'false'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9
        with:
          dotnet-version: '10.0.401'
      - run: dotnet run --project tests/ZeroVoice.Tests -c Release
      - run: dotnet run --project tests/ZeroVoice.UiTests -c Release
      - if: runner.os == 'Windows'
        run: dotnet build src/ZeroVoice.Windows -c Release
      - if: runner.os == 'macOS'
        run: |
          $rid = 'osx-' + [System.Runtime.InteropServices.RuntimeInformation]::ProcessArchitecture.ToString().ToLowerInvariant()
          dotnet publish src/ZeroVoice.Mac -c Release -r $rid --self-contained true -o test-native
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          '{"operation":"capture"}' | & ./test-native/ZeroVoice.Mac
          if ($LASTEXITCODE -ne 0) { throw 'Native helper failed to launch' }
      - if: runner.os == 'macOS'
        run: |
          dotnet publish src/ZeroVoice.Desktop -c Release -r osx-arm64 --self-contained true -o test-app-arm64
          if ($LASTEXITCODE -ne 0) { throw 'ARM64 publish failed' }
          dotnet publish src/ZeroVoice.Desktop -c Release -r osx-x64 --self-contained true -o test-app-x64
          if ($LASTEXITCODE -ne 0) { throw 'Intel publish failed' }
